    bindChips(b,'bpat',v=>{if(!v)return;pat=v;S.settings.breath=v;saveLocal();$('#bDesc',b).textContent=BREATH[v].d;off=el;phase='';});
    const step=()=>{
      if(on)el+=.1;
      const seq=BREATH[pat].seq,L=seq.reduce((a,x)=>a+x[1],0);let c=(el-off)%L,i=0;while(c>=seq[i][1]){c-=seq[i][1];i++;}

/* ============ Demo data ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  const R=mulberry(11);const pick=a=>a[Math.floor(R()*a.length)];
  const st=blank();st.demo=true;const now=Date.now();
  const startK=addDays(dk(now),-64);const start=parseDk(startK).getTime()+21.5*HOUR;

  st.plan.name='Migs';st.plan.spend=350;

  st.plan.signs=[{id:uid(),text:'Staying up past 2 AM on my phone'},{id:uid(),text:'Skipping the Tuesday group'}];

  st.plan.tape={hour:'I’d feel great for a bit, then start planning how to get more.',tomorrow:'No sleep, late for work, lying to my daughter about where I was.',week:'Borrowing money again and hiding it. Back to day one.',sober:'A rough night, but I wake up clear and take her to school like I promised.'};
  const lapseD=31;const lapseT=parseDk(addDays(startK,lapseD)).getTime()+22*HOUR;
  st.lapses.l1={id:'l1',t:lapseT,kind:'lapse',subs:['Shabu (methamphetamine)'],trig:['money','people'],before:'Got my sweldo and ran into an old barkada outside the store.',thought:'“Just tonight. I’ve earned it.”',diff:'Send my pay to savings first and call Kuya Jun right after work.',next:['tell','meet'],u:lapseT};
  const total=daysBetween(startK,dk(now));
  const tw=[['stress',5],['bored',4],['lonely',3],['family',2],['people',2],['party',1],['money',2],['tired',3],['work',2],['cue',1]];
  const wpick=()=>{const s=tw.reduce((a,b)=>a+b[1],0);let r=R()*s;for(const x of tw){if((r-=x[1])<0)return x[0];}return 'stress';};
  for(let d=1;d<=total;d++){
    const k=addDays(startK,d);const prog=d/total;const near=d>=lapseD-5&&d<=lapseD+2;
    const sleepH=clamp(Math.round(((near?5.2:6.4+prog*1.2)+(R()-.5)*2.6)*2)/2,3,10);
    let base=7-4.4*prog+(near?2.4*(1-Math.abs(d-lapseD)/7):0)+(sleepH<6?1.2:0);
    const cr=clamp(Math.round(base+(R()-.5)*2.2),0,10);
    const nAct=clamp(Math.round((10-cr)/3+(R()-.5)*2),0,5);const acts=ACTIONS.map(a=>a.k).sort(()=>R()-.5).slice(0,nAct);
    if(R()>.13||d===lapseD||d===total){

    }
    const nc=(R()<(.95-.6*prog+(near?.5:0))?1:0)+(R()<(near?.5:.12)?1:0);
    for(let j=0;j<nc;j++){
      const hr=pick([8,12,14,16,17,18,19,19,20,20,21,21,22,22,23,1]);const t=parseDk(k).getTime()+hr*HOUR+Math.floor(R()*50)*MIN;if(t>now)continue;
      const i=clamp(cr+Math.round((R()-.2)*2),2,10);const id='c'+d+'_'+j;const tr=[wpick()];if(R()<.3)tr.push(wpick());
      st.cravings[id]={id,t,i,trig:Array.from(new Set(tr)),halt:{h:R()<.18,a:R()<.2,l:R()<.3,t:R()<.35},mins:pick([10,15,15,15,20]),after:Math.max(0,i-2-Math.floor(R()*4)),out:'passed',note:'',u:now};
    }
  }
  st.cravings.cL={id:'cL',t:lapseT-40*MIN,i:9,trig:['money','people'],halt:{h:false,a:false,l:true,t:true},mins:3,after:9,out:'used',note:'',u:now};
  [6,13,20,27,34,41,48,55,62].forEach(d=>{if(d>total)return;const t=parseDk(addDays(startK,d)).getTime()+19*HOUR;let e=[],m=[];
    if(d===27){e=['iso','sleep','mood'];m=['glam','bargain'];}else if(d===20){e=['sleep','nofun','bottle'];}else if(d===34){e=['bottle','mood'];m=['crave'];}else if(d<20){e=R()<.5?['sleep']:[];}else{e=R()<.4?['nofun']:[];}

  return st;
}

  const [hh,mm]=String(hhmm||'20:00').split(':').map(Number);const d=new Date();d.setHours(hh||0,mm||0,0,0);if(d<new Date())d.setDate(d.getDate()+1);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  const n=new Date(),stamp=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+pad(n.getUTCSeconds())+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ebb//Check-in//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:ebb-'+uid()+'@ebb','DTSTAMP:'+stamp,'DTSTART:'+f(d),'DTEND:'+f(new Date(d.getTime()+10*MIN)),'RRULE:FREQ=DAILY','SUMMARY:Check in','DESCRIPTION:Two minutes in Ebb.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Check in','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR',''].join('\r\n');
}
function openReminder(){
  openSheet(b=>{
    b.innerHTML='<div><p class="step">Daily habit</p><h2>Check-in reminder</h2></div><p class="lede">Add a daily reminder to your phone’s calendar. The event only says “Check in”, so nobody else can tell what it’s for.</p>'+
    '<div class="field"><label for="rmT">Remind me at</label><input type="time" id="rmT" value="20:00"></div>'+
    '<div class="actions"><button class="btn btn-primary btn-block" id="rmGo">'+I.cal+'Add to my calendar</button></div><p class="fine">Your phone saves or opens a calendar file. Open it and tap Add. To stop the reminder, delete the event in your calendar.</p>';
    $('#rmGo',b).onclick=async()=>{const r=await shareFile(new Blob([icsText($('#rmT',b).value)],{type:'text/calendar'}),'ebb-check-in.ics','Check-in reminder',true);if(r!=='cancel'&&r!=='fail')toast('Open the file and tap Add.');else if(r==='fail')toast('Couldn’t make the calendar file here.');};
  },{label:'Check-in reminder'});
}
function summaryText(){
  const s=stats(),today=dk(Date.now()),startK=dk(S.profile.start);const ks=[];for(let i=29;i>=0;i--)ks.push(addDays(today,-i));const inR=ks.filter(k=>k>=startK);
  const cis=inR.map(checkin).filter(Boolean),cr=inR.map(dayCrav).filter(v=>v!=null),md=cis.filter(c=>c.mood).map(c=>+c.mood),sl=cis.filter(c=>c.sleep!=null).map(c=>+c.sleep);
  const t0=parseDk(inR[0]||today).getTime();const crav=live(S.cravings).filter(c=>c.t>=t0);const passed=crav.filter(c=>c.out!=='used').length;
  const tc={};crav.forEach(c=>(c.trig||[]).forEach(k=>tc[k]=(tc[k]||0)+1));const top=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,3).map(k=>trigL(k)+' ('+tc[k]+')');
  const bins=Array(8).fill(0);crav.forEach(c=>bins[Math.floor(new Date(c.t).getHours()/3)]++);const pk=bins.indexOf(Math.max(...bins));
  const hc={};HALT.forEach(x=>hc[x.k]=crav.filter(c=>c.halt&&c.halt[x.k]).length);const ht=HALT.slice().sort((a,b)=>hc[b.k]-hc[a.k])[0];
  const slips=lapsesSorted().filter(l=>l.t>=t0&&l.t>S.profile.start),lw=lastWarn();
  const w1=inR.slice(0,7).map(dayCrav).filter(v=>v!=null),w4=inR.slice(-7).map(dayCrav).filter(v=>v!=null);
  const L=['Ebb summary, '+fmtDY(t0)+' to '+fmtDY(Date.now())];
  if(S.plan.name)L.push('Name: '+S.plan.name);
  L.push('Recovering from: '+(S.profile.substances.join(', ')||'not listed'),'Recovery start: '+fmtDY(S.profile.start),'Current stretch: '+dur(s.streakMs)+'. Longest: '+dur(s.longest)+'.','Days without use since start: '+s.clean+' of '+s.total+'.','','Last 30 days','- Check-ins: '+cis.length+' of '+inR.length+' days');
  if(cr.length)L.push('- Average daily craving: '+avg(cr).toFixed(1)+'/10'+(w1.length&&w4.length&&inR.length>=21?' (first week '+avg(w1).toFixed(1)+', last week '+avg(w4).toFixed(1)+')':''));
  if(md.length)L.push('- Average mood: '+avg(md).toFixed(1)+' of 5');
  if(sl.length)L.push('- Average sleep: '+avg(sl).toFixed(1)+' h');
  L.push('- Cravings logged: '+crav.length+', passed without use: '+passed);
  if(top.length)L.push('- Top triggers: '+top.join(', '));
  if(crav.length)L.push('- Cravings peak: '+BIN_LONG[pk]);
  if(crav.length&&hc[ht.k])L.push('- Most common HALT state during cravings: '+ht.l);
  L.push('- Slips: '+(slips.length?slips.map(l=>fmtDY(l.t)+(l.kind==='relapse'?' (return to regular use)':'')).join(', '):'none'));
  if(lw)L.push('- Last warning-signs check: '+STAGES[lw.stage].t+' ('+fmtDY(lw.t)+')');
  L.push('','Self-reported in the Ebb app. Not a diagnosis.');
  return L.join('\n');
}
function openSummary(){
  const txt=summaryText();
  openSheet(b=>{
    b.innerHTML='<div><p class="step">For your counselor or doctor</p><h2>Your last 30 days</h2></div><p class="lede">A plain-text summary you can send or read out at your next session.</p><textarea id="smT" rows="14" readonly style="font-size:14px">'+esc(txt)+'</textarea><p class="fine">It includes what you’re recovering from. Share it only with people you trust.</p><div class="actions">'+(navigator.share?'<button class="btn btn-primary btn-block" id="smS">'+I.share+'Share</button>':'')+'<button class="btn btn-quiet btn-block" id="smC">Copy</button></div><p class="fine" id="smM"></p>';
    const sh=$('#smS',b);if(sh)sh.onclick=async()=>{try{await navigator.share({title:'Ebb summary',text:txt});}catch(e){}};
    $('#smC',b).onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#smM',b).textContent='Copied.';}catch(e){const ta=$('#smT',b);ta.focus();ta.select();$('#smM',b).textContent='Selected. Use Copy from your phone’s menu.';}};
  },{label:'Summary for my counselor'});
}

/* ============ Install on Android ============ */
let DEFER_INSTALL=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER_INSTALL=e;if(S&&S.profile&&ROUTE==='today'&&!busyUI())render();});
window.addEventListener('appinstalled',()=>{DEFER_INSTALL=null;});

/* ============ Global actions ============ */
function shiftCal(n){let m=CAL.m+n,y=CAL.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}CAL={y,m};render();}
const ACTS={
  tab:a=>go(a.dataset.tab),
  sos:()=>openSOS(),craving:()=>openCraving(),checkin:a=>openCheckin(a.dataset.k),lapse:()=>openLapse(),warn:()=>openWarn(),
  breathe:()=>openBreathe(),ground:()=>openGround(),halt:()=>openHaltTool(),tape:()=>openTape(),delay:()=>openDelay(),rules:()=>openRules(),safety:()=>openSafety(),
  day:a=>openDay(a.dataset.k),calprev:()=>shiftCal(-1),calnext:()=>shiftCal(1),entry:a=>openEntry(a.dataset.type,a.dataset.id),
  'sheet-close':()=>{closeSheet();if(PENDING_CELEB){const m=PENDING_CELEB;PENDING_CELEB=null;setTimeout(()=>{if(!busyUI())openCelebrate(m);else PENDING_CELEB=m;},420);}},
  sounds:()=>openSounds(),videos:()=>openVideos(),sexhelp:()=>openSexHelp(),'lock-setup':()=>openLockSetup(),'lock-now':()=>showLock(false),
  reminder:()=>openReminder(),summary:()=>openSummary(),
  'share-streak':()=>{const st=fmtStreak(stats().streakMs);shareImage(String(st.big),st.unit);},
  mile:a=>{const mm=MILES.find(x=>x.h===+a.dataset.h);if(mm)openCelebrate(mm);},
  'share-mile':a=>{const mm=MILES.find(x=>x.h===+a.dataset.h);if(!mm)return;const p=mm.l.split(' ');shareImage(p[0],p.slice(1).join(' '));},
  'install-android':async()=>{if(!DEFER_INSTALL)return;const e=DEFER_INSTALL;DEFER_INSTALL=null;try{e.prompt();await e.userChoice;}catch(_){}render();},
  'edit-music':()=>openListEditor({title:'My calming music',intro:'Songs or playlists that calm you. Paste a link from Spotify, YouTube or anywhere else.',items:S.plan.music,fields:[{k:'name',l:'Name',ph:'For example: Sunday morning playlist'},{k:'url',l:'Link',ph:'https://open.spotify.com/…',type:'url'}],onSave:r=>S.plan.music=r}),
  'edit-reasons':()=>openListEditor({title:'Why I’m doing this',intro:'Short and personal works best. These show up on your Today screen and during cravings.',items:S.plan.reasons,fields:[{k:'text',l:'Reason',ph:'For example: be there for my kids'}],onSave:r=>S.plan.reasons=r}),
  'edit-contacts':()=>openListEditor({title:'My people',intro:'People you can call or text when it’s hard.',items:S.plan.contacts,fields:[{k:'name',l:'Name',ph:'Name'},{k:'phone',l:'Phone',ph:'Phone number',type:'tel'}],onSave:r=>S.plan.contacts=r}),
  'edit-risks':()=>openListEditor({title:'High-risk situations',intro:'Name a situation where using feels likely, then a specific way out.',items:S.plan.risks,fields:[{k:'situation',l:'When',ph:'For example: payday with cash on me',multi:true},{k:'plan',l:'My exit plan',ph:'For example: send money to savings, go straight home',multi:true}],onSave:r=>S.plan.risks=r}),
  'edit-signs':()=>openListEditor({title:'My early warning signs',intro:'Things you notice in yourself before things slide.',items:S.plan.signs,fields:[{k:'text',l:'Warning sign',ph:'For example: skipping meals'}],onSave:r=>S.plan.signs=r}),
  'edit-recovery':()=>openRecoveryEditor(),
  phhelp:()=>openPHHelp(),'backup-file':()=>backupFile(),install:()=>openInstall(),rewards:()=>openRewards(),prefs:()=>openPrefs(),
  addcrav:a=>openCravingEdit(null,a.dataset.k),
  addslip:a=>{const k=a.dataset.k;openLapse({t:k===dk(Date.now())?Date.now():parseDk(k).getTime()+20*HOUR});},
  'edit-triggers':()=>openListEditor({title:'Trigger list',intro:'Rename, remove or add triggers. They appear when you log cravings and slips. Past entries keep their labels.',items:trigList().map(t=>({id:t.k,l:t.l})),fields:[{k:'l',l:'Trigger',ph:'For example: passing the old tambayan'}],max:30,
    onSave:r=>{const old=S.plan.trigOld||{};trigList().forEach(t=>{if(!r.some(x=>x.id===t.k))old[t.k]=t.l;});S.plan.trigOld=old;S.plan.triggers=r.map(x=>({k:x.id,l:x.l}));},
    after:'<button type="button" class="btn btn-line btn-block" id="edReset">Restore the default list</button>',
    wire:b=>{const x=$('#edReset',b);if(x)x.onclick=()=>{S.plan.triggers=null;touchCore();save();closeSheet();render();toast('Default triggers restored.');};}}),
  'edit-actions':()=>openListEditor({title:'Recovery actions',intro:'The things you can tick in your daily check-in. Add what helps you, like jogging, a hobby or a church group.',items:actList().map(t=>({id:t.k,l:t.l})),fields:[{k:'l',l:'Action',ph:'For example: basketball with my cousins'}],max:30,
    onSave:r=>{S.plan.actions=r.map(x=>({k:x.id,l:x.l}));},
    after:'<button type="button" class="btn btn-line btn-block" id="edReset">Restore the default list</button>',
    wire:b=>{const x=$('#edReset',b);if(x)x.onclick=()=>{S.plan.actions=null;touchCore();save();closeSheet();render();toast('Default actions restored.');};}}),
  'edit-lines':()=>openListEditor({title:'My saved numbers',intro:'Numbers you might need: your barangay health center, rural health unit, doctor, counselor or rehab center.',items:S.plan.lines,fields:[{k:'name',l:'Name',ph:'For example: Barangay health center'},{k:'phone',l:'Phone',ph:'Number',type:'tel'},{k:'note',l:'Note',ph:'Hours, address or who to ask for'}],onSave:r=>S.plan.lines=r}),
  'sync-on':async()=>{S.settings.sync=true;save();refreshSyncUI();await pull();toast(Cloud.sync==='ok'?'Private backup is on.':'Backup will retry shortly.');},
  'sync-now':()=>pull(),
  'sync-off':()=>confirmSheet({title:'Turn off private backup?',body:'New entries will only be saved on this device. You can also delete the copy in your Claude account.',ok:'Turn off and delete the backup copy',danger:true,onOk:async()=>{S.settings.sync=false;save();const ok=await deleteCloud();refreshSyncUI();toast(ok?'Backup turned off and deleted.':'Backup turned off. The copy couldn’t be deleted right now.');}}),
  'backup-copy':()=>backupCopy(),'backup-restore':()=>backupRestore(),
  wipe:()=>confirmSheet({title:'Delete all your data?',body:'This erases every entry on this device'+(S.settings.sync?' and in your private backup':'')+'. It can’t be undone. Copy a backup code first if you might want it later.',ok:'Delete everything',danger:true,onOk:async()=>{if(S.settings.sync&&!S.demo)await deleteCloud();S=blank();saveLocal();showOnboarding();}}),
  'demo-exit':()=>{S=blank();saveLocal();showOnboarding();}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=ACTS[a.dataset.act];if(!f)return;e.preventDefault();
  const inSheet=a.closest('#sheetRoot');const act=a.dataset.act;
  if(inSheet&&act!=='sheet-close')closeSheet(true);
  f(a,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!Lock.on&&$('#sheetRoot').classList.contains('open'))ACTS['sheet-close']();});

/* ============ Boot ============ */
function boot(){
  LOCAL_OK=testLocal();
  S=normalize(loadLocal());applyTheme();
  readRoute();
  let goA=null;try{goA=new URLSearchParams(location.search).get('go');if(goA)history.replaceState(null,'',location.pathname+(location.hash||''));}catch(e){}
  if(!S.profile)showOnboarding();else{render();if(lockEnabled())showLock(false);}
  if(goA&&S.profile&&['craving','sos','checkin','breathe','sounds'].includes(goA)){const run=()=>ACTS[goA]({dataset:{}});if(Lock.on)Lock.after=run;else setTimeout(run,150);}
  initCloud();
  if(APP_BUILD&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  if(APP_BUILD&&IS_STANDALONE&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
  setInterval(()=>{if(!document.hidden&&ROUTE==='today')tick();},30000);
}
boot();
