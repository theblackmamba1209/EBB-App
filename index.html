<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ebb">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#E9EFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081A1E" media="(prefers-color-scheme: dark)">
<title>Ebb Recovery Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column. A living tide at the top shows progress toward the next milestone;
   quiet surfaces below; everything a thumb needs sits low on the screen. */
:root{
  --bg:#E9EFEC;
  --surface:#F7FAF8;
  --surface-2:#DEE8E4;
  --ink:#0F2A2E;
  --ink-2:#44605F;
  --muted:#5C7473;
  --line:#CAD8D3;
  --tide:#12786F;
  --tide-ink:#FFFFFF;
  --foam:#CDE7E1;
  --lantern:#B57A16;
  --lantern-soft:#F5E4C2;
  --berry:#AE3D62;
  --berry-soft:#F4D9E2;
  --berry-ink:#FFFFFF;
  --lantern-ink:#FFFFFF;
  --font-display:"Young Serif","New York",ui-serif,Georgia,serif;
  --font-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r-hero:28px; --r-card:18px; --r-ctl:14px;
  --shadow:0 1px 0 rgba(15,42,46,.04),0 14px 30px -18px rgba(15,42,46,.35);
  --gut:max(16px,env(safe-area-inset-left));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081A1E; --surface:#0F262B; --surface-2:#173339; --ink:#E4EFEC; --ink-2:#A8BEBB; --muted:#8AA3A1; --line:#24423F;
    --tide:#4CC3B2; --tide-ink:#04201F; --foam:#164442; --lantern:#F1BF5C; --lantern-soft:#3A3120; --berry:#E87C9F; --berry-soft:#43212D; --berry-ink:#2B0A16; --lantern-ink:#2A1E05;
    --shadow:0 14px 30px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081A1E; --surface:#0F262B; --surface-2:#173339; --ink:#E4EFEC; --ink-2:#A8BEBB; --muted:#8AA3A1; --line:#24423F;
  --tide:#4CC3B2; --tide-ink:#04201F; --foam:#164442; --lantern:#F1BF5C; --lantern-soft:#3A3120; --berry:#E87C9F; --berry-soft:#43212D; --berry-ink:#2B0A16; --lantern-ink:#2A1E05;
  --shadow:0 14px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--tide);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:31px;line-height:1.1}
h2{font-size:23px;line-height:1.2}
h3{font-size:17px;line-height:1.3;margin:0;font-weight:700}
p{margin:0}
.lede{color:var(--ink-2);font-size:17px;max-width:62ch}
.fine{color:var(--muted);font-size:14px;line-height:1.4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px var(--gut);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wordmark{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.wordmark svg{width:26px;height:26px}
.sos{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:999px;border:0;background:var(--berry);color:var(--berry-ink);font-weight:700;font-size:15px}
.sos svg{width:18px;height:18px}
#banner:empty{display:none}
.banner{margin:0 var(--gut) 10px;padding:12px 14px;border-radius:14px;background:var(--lantern-soft);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:15px}
.banner button{flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px}
main{padding:4px var(--gut) calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}

.tabbar{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;min-height:52px;font-size:12px;font-weight:700;border-radius:12px;position:relative}
.tabbar button[aria-current="page"]{color:var(--tide)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--tide)}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border-radius:var(--r-card);padding:18px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.card.soft{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-h a,.linkbtn{font-size:15px;font-weight:700;color:var(--tide);background:none;border:0;padding:6px 0;text-decoration:none}
.sec-title{margin:10px 2px -4px;font-family:var(--font-display);font-size:21px}
.btn{appearance:none;-webkit-appearance:none;border:0;font-weight:700;min-height:50px;padding:12px 18px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.2;text-decoration:none}
.btn-primary{background:var(--tide);color:var(--tide-ink)}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-danger{background:var(--berry);color:var(--berry-ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45}
.btn-icon{border:0;background:var(--surface-2);color:var(--ink-2);width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;min-height:42px;padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px;line-height:1.2;color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--tide);color:var(--tide-ink);box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:16px}
.seg .chip{box-shadow:none;background:transparent;border-radius:12px;text-align:center;padding:9px 6px;font-size:15px}
.seg .chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.flabel{font-weight:700;font-size:16px}
input[type=text],input[type=tel],input[type=datetime-local],input[type=date],textarea{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink);min-height:50px;-webkit-appearance:none;appearance:none}
input[type=datetime-local]{display:block;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
textarea{resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{outline:2px solid var(--tide);outline-offset:0}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sv{font-family:var(--font-display);font-size:30px;line-height:1}
.sv small{font-size:16px;color:var(--muted)}
.sv span{font-family:var(--font-body);font-size:15px;color:var(--ink-2);margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(to right,var(--tide) var(--p,50%),var(--surface-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:var(--tide)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2.5px var(--tide),0 3px 8px rgba(0,0,0,.25);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2.5px solid var(--tide)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-6px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper output{font-family:var(--font-display);font-size:30px;min-width:4ch;text-align:center}
.stepper button{width:50px;height:50px;border-radius:14px;border:0;background:var(--surface-2);font-size:26px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--foam);color:var(--ink)}
.pill.warn{background:var(--lantern-soft);color:var(--ink)}
.pill.hi{background:var(--berry-soft);color:var(--ink)}
.pill.act{background:var(--berry);color:var(--berry-ink)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok .dot{background:var(--tide)} .pill.warn .dot{background:var(--lantern)} .pill.hi .dot{background:var(--berry)}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.empty{padding:22px 18px;border-radius:var(--r-card);border:1.5px dashed var(--line);color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* ---------- Hero tide ---------- */
.hero{position:relative;border-radius:var(--r-hero);overflow:hidden;min-height:336px;background:var(--surface);box-shadow:var(--shadow)}
canvas.tide{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;padding:20px 22px 18px;display:flex;flex-direction:column;min-height:336px}
.hero-label{font-size:15px;color:var(--ink-2);font-weight:700}
.hero-num{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.hero-num .n{font-family:var(--font-display);font-size:96px;line-height:.92;letter-spacing:-.03em}
.hero-num .u{font-family:var(--font-display);font-size:28px}
.hero-sub{font-size:17px;color:var(--ink-2);margin-top:6px}
.hero-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:15px;padding-top:18px}
.hero-foot b{font-family:var(--font-display);font-weight:400;font-size:19px;display:block;color:var(--ink)}
.hero-foot .r{text-align:right}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--line)}
.tally>div{padding:14px 16px}
.tally>div+div{border-left:1px solid var(--line)}
.tally .big{font-family:var(--font-display);font-size:30px;line-height:1.05;color:var(--ink)}
.tally .big small{font-size:17px;color:var(--muted)}
.tally p{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.3}
.cta{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;padding:18px;border-radius:20px;background:var(--tide);color:var(--tide-ink)}
.cta svg{width:34px;height:34px;flex:none}
.cta b{display:block;font-size:20px;font-family:var(--font-display);font-weight:400}
.cta span{font-size:15px;opacity:.86}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;text-align:left;padding:14px 16px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;min-height:84px;color:var(--ink)}
.tile b{font-size:17px}
.tile span{font-size:14px;color:var(--ink-2)}
.tile .pill{align-self:flex-start;margin-top:auto}
.reason{font-family:var(--font-display);font-size:24px;line-height:1.25;text-wrap:balance}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px}
.kv b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.kv span{font-size:13px;color:var(--ink-2)}

/* ---------- Philippines + editing ---------- */
.greet{font-family:var(--font-display);font-size:22px;line-height:1.2;margin:2px 2px -4px}
.hero-meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:15px;color:var(--ink-2)}
.hero-meta b{font-family:var(--font-display);font-weight:400;font-size:20px;display:block;color:var(--ink)}
.hero-meta .r{text-align:right}
.tally>.money{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.tally>.money p{margin-top:0}
.tl{font-family:var(--font-display);font-size:24px;color:var(--ink-2);margin-top:-6px}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 10px;border-radius:10px;background:var(--lantern-soft);color:var(--ink);font-size:14px}
.reward svg{width:16px;height:16px}
.addrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.addrow .btn{min-height:46px;padding:8px;font-size:15px}
.ph-sec{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.ph-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.setrow{border:0;width:100%;background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--ink)}
.setrow b{display:block;font-size:16px}
.setrow span{font-size:14px;color:var(--ink-2)}
.setrow svg{color:var(--muted)}
[hidden]{display:none!important}
.install{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.install ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.install li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:st}
.install li::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--tide);color:var(--tide-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.install li b{display:block}
.install .ico{display:inline-flex;vertical-align:-5px;width:22px;height:22px;color:var(--tide)}

/* ---------- Journey ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h h2{font-size:21px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:15px;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.cal .clean{background:var(--foam)}
.cal .used{background:var(--berry);color:var(--berry-ink)}
.cal .used::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;background:
  linear-gradient(45deg,transparent 40%,var(--berry-ink) 40%,var(--berry-ink) 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,var(--berry-ink) 40%,var(--berry-ink) 60%,transparent 60%)}
.cal .start{box-shadow:inset 0 0 0 2px var(--lantern)}
.cal .pre,.cal .future{color:var(--muted)}
.cal .today{font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.cal .ci{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--tide)}
.cal .used .ci{background:var(--berry-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.miles{list-style:none;margin:0;padding:0;position:relative}
.miles li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:0 0 18px;position:relative}
.miles li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.miles li:last-child::before{display:none}
.miles .node{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.miles .got .node{background:var(--lantern);box-shadow:none;color:var(--lantern-ink)}
.miles .got .node svg{width:16px;height:16px;stroke-width:2.6}
.miles .nx .node{box-shadow:inset 0 0 0 2px var(--tide);background:conic-gradient(var(--tide) calc(var(--pp)*1%),var(--surface) 0)}
.miles b{font-size:17px}
.miles .when{font-size:14px;color:var(--ink-2)}
.miles .note{font-size:14px;color:var(--ink-2);margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2);max-width:62ch}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed button{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);color:var(--ink)}
.feed li:first-child button{border-top:0}
.feed .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink-2)}
.feed .ic.l{background:var(--berry-soft);color:var(--berry)}
.feed .ic.c{background:var(--foam);color:var(--tide)}
.feed b{font-size:16px;display:block}
.feed span{font-size:14px;color:var(--ink-2)}
.feed time{font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- Insights ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:12px}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.05}
.stat span{font-size:13px;color:var(--ink-2);display:block;margin-top:4px;line-height:1.3}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;opacity:.6}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--tide);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--tide);opacity:.13}
.chart .dot{fill:var(--tide)}

const KEY='ebb-recovery-v1';
let LOCAL_OK=false, S=null;
function testLocal(){try{const k='__ebb_t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function loadLocal(){if(!LOCAL_OK)return null;try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function saveLocal(){if(!LOCAL_OK)return false;try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function blank(){return {v:1,profile:null,settings:{sync:false,region:'ph',lastMile:0},plan:{name:'',spend:0,reasons:[],contacts:[],risks:[],signs:[],lines:[],rewards:{},triggers:null,actions:null,trigOld:{},tape:{hour:'',tomorrow:'',week:'',sober:''}},checkins:{},cravings:{},lapses:{},warn:{},demo:false,coreU:0,u:0};}
function normalize(x){
  const o=Object.assign(blank(),x||{});
  o.settings=Object.assign(blank().settings,o.settings||{});
  o.plan=Object.assign(blank().plan,o.plan||{});
  o.plan.tape=Object.assign(blank().plan.tape,o.plan.tape||{});
  ['checkins','cravings','lapses','warn'].forEach(k=>{if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={};});
  ['reasons','contacts','risks','signs','lines'].forEach(k=>{if(!Array.isArray(o.plan[k]))o.plan[k]=[];});
  ['rewards','trigOld'].forEach(k=>{if(!o.plan[k]||typeof o.plan[k]!=='object'||Array.isArray(o.plan[k]))o.plan[k]={};});
  return o;
}
function save(){S.u=Date.now();saveLocal();scheduleSync();}
function touchCore(){S.coreU=Date.now();}
const live=m=>Object.values(m||{}).filter(x=>x&&!x.del);
function trigList(){return S&&Array.isArray(S.plan.triggers)&&S.plan.triggers.length?S.plan.triggers:TRIGGERS;}
function trigL(k){const f=trigList().find(t=>t.k===k);return f?f.l:((S&&S.plan.trigOld||{})[k]||TRIG[k]||k);}
function actList(){return S&&Array.isArray(S.plan.actions)&&S.plan.actions.length?S.plan.actions:ACTIONS;}
const peso=n=>'₱'+Math.round(n).toLocaleString(LOC);

/* ============ Derived numbers ============ */
function lapsesSorted(){return live(S.lapses).sort((a,b)=>a.t-b.t);}
function stats(now){
  now=now||Date.now();
  const start=S.profile.start;
  const ut=[start].concat(lapsesSorted().map(l=>l.t).filter(t=>t>start&&t<=now)).sort((a,b)=>a-b);
  const last=ut[ut.length-1];
  const streakMs=Math.max(0,now-last);
  let longest=streakMs; for(let i=1;i<ut.length;i++)longest=Math.max(longest,ut[i]-ut[i-1]);
  const startK=dk(start), todayK=dk(now);
  const total=Math.max(0,daysBetween(startK,todayK));
  const useDays=new Set(); lapsesSorted().forEach(l=>{const k=dk(l.t);if(l.t>start&&l.t<=now&&k>startK)useDays.add(k);});
  const clean=Math.max(0,total-useDays.size);
  return {last,streakMs,longest,total,clean,used:useDays.size,slips:ut.length-1,startK,todayK,useDays};
}
function fmtStreak(ms){
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/HOUR),m=Math.floor(ms%HOUR/MIN);
  if(d>=1)return {big:d,unit:d===1?'day':'days',small:h+' h '+m+' min'};
  if(h>=1)return {big:h,unit:h===1?'hour':'hours',small:m+' min'};
  return {big:m,unit:m===1?'minute':'minutes',small:'The clock is running.'};
}
function dur(ms){if(ms>=DAY*1.5){const d=Math.round(ms/DAY);return d+' days';}if(ms>=DAY)return '1 day';const h=Math.max(1,Math.round(ms/HOUR));return h+(h===1?' hour':' hours');}
function nextMile(ms){const hrs=ms/HOUR;let prev=0;for(const m of MILES){if(hrs<m.h)return {next:m,prevH:prev,prog:(hrs-prev)/(m.h-prev),leftMs:m.h*HOUR-ms};prev=m.h;}return {next:null,prevH:prev,prog:1,leftMs:0};}
function intensityWord(v){v=+v;return v===0?'None':v<=2?'Mild':v<=5?'Moderate':v<=8?'Strong':'Intense';}
function dayCravings(k){return live(S.cravings).filter(c=>dk(c.t)===k);}
function checkin(k){const c=S.checkins[k];return c&&!c.del?c:null;}
function stageOf(e,m,p){return p?'act':m>=2?'mental':(m===1||e>=3)?'emotional':'steady';}
function lastWarn(){return live(S.warn).sort((a,b)=>b.t-a.t)[0]||null;}

/* ============ Private backup (claude db) ============ */
const Cloud={db:null,uid:null,status:'checking',sync:'idle',err:null,last:0,busy:false,dirty:new Set(),hash:{},timer:null,retry:null};
let cloudDone; const CloudReady=new Promise(r=>cloudDone=r);
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);}
async function initCloud(){
  if(APP_BUILD){Cloud.status='absent';cloudDone();return;}
  try{
    let t0=Date.now();
    while(!(window.claude&&typeof window.claude.use==='function')){if(Date.now()-t0>4000)throw 0;await sleep(200);}
    const both=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),12000);
    const db=both[0],user=both[1];
    if(!db||!user)throw 0;
    const id=await withTimeout(user.id(),8000);
    if(!id)throw 0;
    Cloud.db=db;Cloud.uid=id;Cloud.status='ready';
  }catch(e){Cloud.status='absent';}
  cloudDone();refreshSyncUI();
  if(Cloud.status==='ready'&&S.profile&&S.settings.sync&&!S.demo)pull();
}
const userCol=()=>Cloud.db.collection('data/users/'+Cloud.uid);
function buildDocs(){
  const out={core:{profile:S.profile,plan:S.plan,settings:{region:S.settings.region||null,lastMile:S.settings.lastMile||0},u:S.coreU||0}};
  const put=(k,id,obj,t)=>{const key='m-'+dk(t).slice(0,7);(out[key]=out[key]||{checkins:{},cravings:{},lapses:{},warn:{}})[k][id]=obj;};
  Object.entries(S.checkins).forEach(([id,o])=>put('checkins',id,o,parseDk(id).getTime()));
  ['cravings','lapses','warn'].forEach(k=>Object.entries(S[k]).forEach(([id,o])=>put(k,id,o,o.t)));
  return clone(out);
}
function mergeCore(r){
  if(!r||!r.u||!r.profile)return false;
  if(r.u>(S.coreU||0)){S.profile=r.profile;S.plan=normalize({plan:r.plan}).plan;const sync=S.settings.sync;S.settings=Object.assign({},S.settings,r.settings||{},{sync});S.coreU=r.u;return true;}
  return false;
}
function mergeMonth(r){
  let ch=false;
  ['checkins','cravings','lapses','warn'].forEach(k=>{const m=(r&&r[k])||{};Object.keys(m).forEach(id=>{const a=S[k][id],b=m[id];if(b&&(!a||(b.u||0)>(a.u||0))){S[k][id]=b;ch=true;}});});
  return ch;
}
async function pull(){
  if(Cloud.status!=='ready'||!S.settings.sync||S.demo)return;
  Cloud.sync='syncing';refreshSyncUI();
  try{
    const snap=await withTimeout(userCol().get(),12000);
    let changed=false;const remote={};
    snap.docs.forEach(d=>{if(!d.exists)return;const data=clone(d.data());remote[d.id]=data;
      if(d.id==='core')changed=mergeCore(data)||changed;else if(d.id.indexOf('m-')===0)changed=mergeMonth(data)||changed;});
    Object.keys(remote).forEach(id=>Cloud.hash[id]=stable(remote[id]));
    if(changed){saveLocal();if(S.profile&&$('#onboard').hidden)render();}
    const docs=buildDocs();Object.keys(docs).forEach(id=>{if(Cloud.hash[id]!==stable(docs[id]))Cloud.dirty.add(id);});
    Cloud.sync='ok';Cloud.last=Date.now();Cloud.err=null;
    await flush();
    return changed;
  }catch(e){Cloud.sync='error';Cloud.err=e&&e.code;refreshSyncUI();return false;}
}
function scheduleSync(){
  if(Cloud.status!=='ready'||!S.settings.sync||S.demo||!S.profile)return;
  clearTimeout(Cloud.timer);
  Cloud.timer=setTimeout(()=>{const docs=buildDocs();Object.keys(docs).forEach(id=>{if(Cloud.hash[id]!==stable(docs[id]))Cloud.dirty.add(id);});flush();},1200);
}
async function flush(){
  if(Cloud.busy||Cloud.status!=='ready'||!S.settings.sync||S.demo)return;
  if(!Cloud.dirty.size){refreshSyncUI();return;}
  Cloud.busy=true;Cloud.sync='syncing';refreshSyncUI();
  let id=null;
  try{
    const docs=buildDocs();
    while(Cloud.dirty.size){
      id=Cloud.dirty.values().next().value;Cloud.dirty.delete(id);
      const body=docs[id]||{checkins:{},cravings:{},lapses:{},warn:{}};
      await withTimeout(userCol().doc(id).set(body),15000);
      Cloud.hash[id]=stable(body);id=null;
    }
    Cloud.sync='ok';Cloud.last=Date.now();Cloud.err=null;
  }catch(e){

/* ============ Tide canvas ============ */
const Tides=new Set();
function makeTide(canvas,levelFn,opt){
  opt=opt||{};
  const ctx=canvas.getContext('2d');let w=0,h=0,raf=0,alive=true,cols=null,n=0;const t0=performance.now();
  function size(){const r=canvas.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);w=r.width;h=r.height;if(!w||!h)return;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}
  function readCols(){const cs=getComputedStyle(canvas);cols={foam:cs.getPropertyValue('--foam').trim()||'#CDE7E1',tide:cs.getPropertyValue('--tide').trim()||'#12786F'};}
  const layers=[{a:.42,amp:12,k:1.5,s:.28,ph:0,dy:-8},{a:.68,amp:8,k:1.05,s:-.38,ph:2.1,dy:6},{a:1,amp:6,k:.72,s:.52,ph:4.2,dy:20}];
  function draw(t){
    if(!w)size();if(!w)return;if(!cols||n%120===0)readCols();n++;
    ctx.clearRect(0,0,w,h);
    const o=levelFn(t)||{};const L=o.level==null?.4:o.level,A=o.amp==null?1:o.amp;const base=h*(1-L);
    layers.forEach((ly,i)=>{
      const pts=[];
      for(let x=0;x<=w+6;x+=6){const u=x/w;pts.push([x,base+ly.dy+Math.sin(u*Math.PI*2*ly.k+t*ly.s+ly.ph)*ly.amp*A+Math.sin(u*Math.PI*5.3*ly.k-t*ly.s*1.7)*ly.amp*.3*A]);}
      ctx.beginPath();ctx.moveTo(0,h);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(w,h);ctx.closePath();
      ctx.globalAlpha=ly.a;ctx.fillStyle=cols.foam;ctx.fill();
      if(i===0||i===2){ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.globalAlpha=i===0?.55:.35;ctx.strokeStyle=cols.tide;ctx.lineWidth=i===0?1.6:1.2;ctx.stroke();}
    });
    ctx.globalAlpha=1;
  }
  function loop(now){if(!alive)return;if(!canvas.isConnected){api.destroy();return;}draw((now-t0)/1000);raf=requestAnimationFrame(loop);}
  const api={
    start(){cancelAnimationFrame(raf);if(RM.matches||opt.still){size();draw(2);return;}raf=requestAnimationFrame(loop);},
    stop(){cancelAnimationFrame(raf);},
    destroy(){alive=false;cancelAnimationFrame(raf);Tides.delete(api);},
    resize(){size();if(RM.matches||opt.still)draw(2);},
    redraw(){readCols();if(RM.matches||opt.still)draw(2);}
  };
  api.canvas=canvas;Tides.add(api);size();api.start();return api;
}

const CH={};
function lineChart(id,pts,o){
  const W=340,H=160,pl=26,pr=26,pt=14,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=pts.length;
  const x=i=>pl+(n<=1?iw/2:i*iw/(n-1)),y=val=>pt+ih-(val-o.min)/(o.max-o.min)*ih;
  let g='';o.ticks.forEach(t=>{g+='<line class="'+(t===o.min?'base':'g')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y(t)+3.5)+'" text-anchor="end">'+(o.tickFmt?o.tickFmt(t):t)+'</text>';});
  const segs=[];let cur=[];pts.forEach((p,i)=>{if(p.v==null){if(cur.length)segs.push(cur);cur=[];}else cur.push([x(i),y(p.v)]);});if(cur.length)segs.push(cur);
  const P=s=>s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
  const area=segs.filter(s=>s.length>1).map(s=>'<path class="ar" d="M'+s[0][0].toFixed(1)+','+y(o.min)+'L'+P(s)+'L'+s[s.length-1][0].toFixed(1)+','+y(o.min)+'Z"/>').join('');
  const line=segs.map(s=>s.length===1?'<circle class="dot" cx="'+s[0][0]+'" cy="'+s[0][1]+'" r="2.6"/>':'<path class="ln" d="M'+P(s)+'"/>').join('');
  let li=-1;for(let i=n-1;i>=0;i--)if(pts[i].v!=null){li=i;break;}
  const end=li>=0?'<circle class="end" cx="'+x(li)+'" cy="'+y(pts[li].v)+'" r="5"/><text class="endl" text-anchor="end" x="'+(x(li)+6)+'" y="'+(y(pts[li].v)-10)+'">'+(o.fmt?o.fmt(pts[li].v):pts[li].v)+'</text>':'';
  const xl=[0,Math.floor((n-1)/2),n-1].map((i,j)=>'<text class="ax" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+(j===0?'start':j===2?'end':'middle')+'">'+esc(fmtD(parseDk(pts[i].k).getTime()))+'</text>').join('');
  CH[id]={pts,x,W,pl,iw,fmt:o.fmt,unit:o.unit};
  return '<div class="chart" id="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">'+g+area+line+end+xl+'<line class="xh" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" style="opacity:0"/></svg><div class="tip" hidden></div></div>';
}
function wireLine(id){
  const el=document.getElementById(id);if(!el)return;const c=CH[id];const svg=$('svg',el),tip=$('.tip',el),xh=$('.xh',svg);
  const show=cx=>{const r=svg.getBoundingClientRect();const sx=(cx-r.left)/r.width*c.W;let i=Math.round((sx-c.pl)/c.iw*(c.pts.length-1));i=clamp(i,0,c.pts.length-1);const p=c.pts[i];const X=c.x(i);
    xh.setAttribute('x1',X);xh.setAttribute('x2',X);xh.style.opacity=1;tip.hidden=false;
    tip.innerHTML='<b>'+(p.v==null?'No entry':esc(c.fmt?c.fmt(p.v):p.v)+(c.unit||''))+'</b>'+esc(fmtD(parseDk(p.k).getTime(),{weekday:'short',month:'short',day:'numeric'}));
    const px=X/c.W*r.width;tip.style.left=clamp(px-60,0,r.width-120)+'px';tip.style.top='-52px';};
  const hide=()=>{xh.style.opacity=0;tip.hidden=true;};
  svg.addEventListener('pointerdown',e=>show(e.clientX));
  svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.pressure>0)show(e.clientX);});
  svg.addEventListener('pointerleave',hide);svg.addEventListener('pointercancel',hide);
}
function hbars(items){const max=Math.max(1,...items.map(i=>i.v));return '<ul class="hbars">'+items.map(i=>'<li><span class="hl">'+esc(i.l)+'</span><span class="hb" aria-hidden="true"><i style="width:'+(i.v/max*100).toFixed(1)+'%"></i></span><span class="hv">'+i.v+'</span></li>').join('')+'</ul>';}
function renderInsights(v){
  const today=dk(Date.now());const keys=[];for(let i=29;i>=0;i--)keys.push(addDays(today,-i));
  const startK=dk(S.profile.start);
  const crav=live(S.cravings);
  const cravPts=keys.map(k=>{if(k<startK)return {k,v:null};const ci=checkin(k);const logs=dayCravings(k).map(c=>c.i);const vals=[];if(ci&&ci.craving!=null)vals.push(ci.craving);if(logs.length)vals.push(Math.max(...logs));return {k,v:vals.length?Math.max(...vals):null};});
  const moodPts=keys.map(k=>{const ci=checkin(k);return {k,v:ci&&ci.mood?+ci.mood:null};});
  const nCrav=cravPts.filter(p=>p.v!=null).length,nMood=moodPts.filter(p=>p.v!=null).length;
  const nCi=keys.filter(k=>checkin(k)).length;
  const noUse=crav.filter(c=>c.out!=='used').length;
  const surfed=crav.filter(c=>c.after!=null&&c.i!=null);
  const drop=surfed.length?avg(surfed.map(c=>c.i-c.after)):null;
  // triggers
  const tc={};crav.forEach(c=>(c.trig||[]).forEach(k=>tc[k]=(tc[k]||0)+1));live(S.lapses).forEach(l=>(l.trig||[]).forEach(k=>tc[k]=(tc[k]||0)+1));
  const trigs=Object.keys(tc).map(k=>({l:trigL(k),v:tc[k]})).sort((a,b)=>b.v-a.v).slice(0,6);
  // time of day
  const bins=[0,0,0,0,0,0,0,0];crav.forEach(c=>{bins[Math.floor(new Date(c.t).getHours()/3)]++;});
  const bmax=Math.max(1,...bins);const peak=bins.indexOf(Math.max(...bins));
  const binL=['12a','3a','6a','9a','12p','3p','6p','9p'];
  const binLong=['12 to 3 AM','3 to 6 AM','6 to 9 AM','9 AM to 12 PM','12 to 3 PM','3 to 6 PM','6 to 9 PM','9 PM to 12 AM'];
  // HALT
  const hc={h:0,a:0,l:0,t:0};let withHalt=0;crav.forEach(c=>{let any=false;HALT.forEach(x=>{if(c.halt&&c.halt[x.k]){hc[x.k]++;any=true;}});if(any)withHalt++;});
  // patterns
  const cis=live(S.checkins).filter(c=>c.craving!=null);const pats=[];
  const low=cis.filter(c=>c.sleep!=null&&c.sleep<6),ok=cis.filter(c=>c.sleep!=null&&c.sleep>=7);
  if(low.length>=3&&ok.length>=3)pats.push({t:'On days after less than 6 hours of sleep, your cravings averaged '+avg(low.map(c=>c.craving)).toFixed(1)+' out of 10. After 7 hours or more, they averaged '+avg(ok.map(c=>c.craving)).toFixed(1)+'.',s:'brower'});
  const wa=cis.filter(c=>(c.actions||[]).length>=2),na=cis.filter(c=>!(c.actions||[]).length);
  if(wa.length>=3&&na.length>=3)pats.push({t:'On days you did two or more recovery actions, cravings averaged '+avg(wa.map(c=>c.craving)).toFixed(1)+'. On days with none, '+avg(na.map(c=>c.craving)).toFixed(1)+'.',s:'melemis'});
  if(crav.length>=5){const top=HALT.slice().sort((a,b)=>hc[b.k]-hc[a.k])[0];pats.push({t:Math.round(withHalt/crav.length*100)+'% of your logged cravings came when you were hungry, angry, lonely or tired. '+top.l+' came up most.',s:'kretchman'});}
  if(trigs.length&&crav.length>=5)pats.push({t:'Your most common trigger is '+trigs[0].l.toLowerCase()+'. Add it to the high-risk situations in My plan with a specific exit plan.',s:'larimer'});
  const tableRows=cravPts.filter(p=>p.v!=null).slice(-30).reverse().map(p=>'<tr><td>'+esc(fmtD(parseDk(p.k).getTime(),{weekday:'short',month:'short',day:'numeric'}))+'</td><td>'+p.v+'/10</td><td>'+(checkin(p.k)&&checkin(p.k).mood?esc(MOODS.find(m=>m.v==checkin(p.k).mood).l):'–')+'</td></tr>').join('');
  v.innerHTML=
  '<div class="stats3"><div class="stat"><b class="num">'+noUse+'<small style="font-size:15px;color:var(--muted)">/'+crav.length+'</small></b><span>cravings passed without use</span></div><div class="stat"><b class="num">'+(drop==null?'–':'−'+drop.toFixed(1))+'</b><span>average drop after riding one out</span></div><div class="stat"><b class="num">'+nCi+'<small style="font-size:15px;color:var(--muted)">/30</small></b><span>check-ins in the last 30 days</span></div></div>'+
  '<div class="card"><div><h3>Craving strength, last 30 days</h3><p class="fine">Strongest craving each day, 0 to 10, from check-ins and craving logs. Tap the chart for a day.</p></div>'+
    (nCrav>=2?lineChart('chC',cravPts,{min:0,max:10,ticks:[0,5,10],label:'Daily craving strength over the last 30 days',unit:'/10'})+'<details class="tbl"><summary>Show as a table</summary><table><thead><tr><th>Day</th><th>Craving</th><th>Mood</th></tr></thead><tbody>'+tableRows+'</tbody></table></details>':'<p class="fine">Log a few check-ins or cravings to see this chart.</p>')+'</div>'+
  '<div class="card"><div><h3>Mood, last 30 days</h3><p class="fine">From your daily check-ins: 1 is very low, 5 is great.</p></div>'+
    (nMood>=2?lineChart('chM',moodPts,{min:1,max:5,ticks:[1,3,5],label:'Daily mood over the last 30 days',fmt:v2=>MOODS[v2-1].l,tickFmt:t=>t}):'<p class="fine">Mood appears after two check-ins.</p>')+'</div>'+
  (pats.length?'<h2 class="sec-title">Patterns in your entries</h2><div class="card">'+pats.map(p=>'<div class="insight"><div><p>'+esc(p.t)+'</p>'+cite(p.s)+'</div></div>').join('')+'<p class="fine">These are patterns in your own entries, not proof of cause. They’re worth talking through with a counselor.</p></div>':'')+
  '<div class="card"><div><h3>What sets off your cravings</h3><p class="fine">From craving logs and slips. Marlatt’s research found negative emotions are the most common high-risk situation.</p></div>'+(trigs.length?hbars(trigs):'<p class="fine">Triggers appear once you log cravings.</p>')+cite('larimer')+'</div>'+
  '<div class="card"><div><h3>When cravings hit</h3><p class="fine">Logged cravings by time of day. Tap a bar.</p></div>'+(crav.length?
    '<p class="cap" id="colCap">Most cravings: '+binLong[peak]+' ('+bins[peak]+')</p><div class="cols" role="img" aria-label="Cravings by time of day">'+bins.map((b,i)=>'<button type="button" data-bin="'+i+'" aria-label="'+binLong[i]+': '+b+' cravings"><i class="'+(i===peak?'':'lo')+'" style="height:'+(b/bmax*100)+'%"></i>'+(i===peak?'<em style="bottom:calc('+(b/bmax*100)+'% + 3px)">'+b+'</em>':'')+'</button>').join('')+'</div><div class="cols-x" aria-hidden="true">'+binL.map(l=>'<span>'+l+'</span>').join('')+'</div>'
    :'<p class="fine">This fills in as you log cravings.</p>')+'</div>'+
  '<div class="card"><div><h3>HALT during cravings</h3><p class="fine">How often each state was present when you logged a craving.</p></div>'+(crav.length?hbars(HALT.map(x=>({l:x.l,v:hc[x.k]}))):'<p class="fine">Nothing logged yet.</p>')+'</div>';
  wireLine('chC');wireLine('chM');
  const cols=$('.cols',v);if(cols)cols.addEventListener('click',e=>{const b=e.target.closest('[data-bin]');if(!b)return;const i=+b.dataset.bin;$('#colCap').textContent=binLong[i]+': '+bins[i]+(bins[i]===1?' craving':' cravings');});
}

    '<div class="status '+(S.settings.lastBackup?'ok':'wait')+'"><i></i><span>'+(S.settings.lastBackup?'Last backup '+esc(fmtDY(S.settings.lastBackup)):'No backup saved yet')+'</span></div>'+

    '<div id="syncStatus" class="status '+sl.c+'"><i></i><span>'+esc(sl.t)+'</span></div><div id="syncBtns">'+syncButtons()+'</div>'+

    '<div class="row"><button class="btn btn-quiet" data-act="backup-copy">Copy backup code</button><button class="btn btn-quiet" data-act="backup-restore">Restore</button></div>'+

  '<p class="fine">Ebb supports recovery. It doesn’t replace treatment, medication, medical or legal advice. If you or someone else is in danger, call 911.</p></div>';

/* ============ Flows ============ */
function openCheckin(k){
  k=k||dk(Date.now());const ex=checkin(k);
  const C=ex?clone(ex):{id:k,d:k,mood:null,craving:3,halt:{h:false,a:false,l:false,t:false},sleep:7,used:false,actions:[],note:''};
  if(!C.halt)C.halt={};
  const isToday=k===dk(Date.now());
  openSheet(b=>{
    b.innerHTML='<div><p class="step">'+(isToday?'Today':esc(fmtD(parseDk(k).getTime(),{weekday:'long',month:'long',day:'numeric'})))+'</p><h2>Daily check-in</h2></div>'+
    '<div class="field"><span class="flabel">How are you feeling?</span>'+segHTML('mood',MOODS,C.mood)+'</div>'+
    sliderHTML('ciC','Strongest craving'+(isToday?' today':''),C.craving)+
    '<div class="field"><span class="flabel">'+(isToday?'Right now I’m…':'That day I was…')+'</span>'+chipsHTML('halt',HALT,HALT.filter(x=>C.halt[x.k]).map(x=>x.k))+'</div>'+
    '<div class="field"><span class="flabel" id="slL">Sleep the night before</span><div class="stepper" role="group" aria-labelledby="slL"><button type="button" id="slM" aria-label="Less sleep">−</button><output id="slO" class="num">'+C.sleep+'h</output><button type="button" id="slP" aria-label="More sleep">+</button></div></div>'+
    '<div class="field"><span class="flabel">Did you use'+(isToday?' today':'')+'?</span>'+segHTML('used',[{v:'no',l:'No'},{v:'yes',l:'Yes'}],C.used?'yes':'no')+'</div>'+
    '<div class="field"><span class="flabel">What did you do for your recovery?</span>'+chipsHTML('acts',actList(),C.actions)+'</div>'+
    '<div class="field"><label for="ciN">Note or something you’re grateful for</label><textarea id="ciN" rows="3" placeholder="Optional">'+esc(C.note)+'</textarea></div>'+
    '<div class="actions"><button class="btn btn-primary btn-block" id="ciSave">Save check-in</button>'+(ex?'<button class="btn btn-line btn-block" id="ciDel" style="color:var(--berry)">Delete this check-in</button>':'')+'</div>';
    bindChips(b,'mood',v=>C.mood=v);bindSlider(b,'ciC',v=>C.craving=v);
    bindChips(b,'halt',vals=>{HALT.forEach(x=>C.halt[x.k]=vals.includes(x.k));});
    bindChips(b,'used',v=>C.used=v==='yes');bindChips(b,'acts',vals=>C.actions=vals);
    const so=$('#slO',b);$('#slM',b).onclick=()=>{C.sleep=clamp(C.sleep-.5,0,16);so.textContent=C.sleep+'h';};$('#slP',b).onclick=()=>{C.sleep=clamp(C.sleep+.5,0,16);so.textContent=C.sleep+'h';};
    $('#ciSave',b).onclick=()=>{
      C.note=$('#ciN',b).value.trim();C.u=Date.now();S.checkins[k]=C;
      let newLapse=null;
      if(C.used&&!live(S.lapses).some(l=>dk(l.t)===k)){const t=isToday?Date.now():parseDk(k).getTime()+12*HOUR;newLapse={id:uid(),t,kind:'lapse',subs:S.profile.substances.slice(0,1),trig:[],auto:true,u:Date.now()};S.lapses[newLapse.id]=newLapse;}
      save();closeSheet(true);render();
      if(newLapse){openLapse({id:newLapse.id,fromCheckin:true});}else toast('Check-in saved.');
    };
    if(ex)$('#ciDel',b).onclick=()=>confirmSheet({title:'Delete this check-in?',ok:'Delete',danger:true,onOk:()=>{S.checkins[k]=Object.assign({},S.checkins[k],{del:true,u:Date.now()});save();render();toast('Check-in deleted.');}});
  },{label:'Daily check-in'});
}

function openCraving(){
  const C={id:uid(),t:Date.now(),i:6,trig:[],halt:{h:false,a:false,l:false,t:false},dur:15};
  let raf=0,tmr=0,paused=false,elapsed=0,lastT=0,tide=null;
  openSheet(b=>stepA(b),{label:'Ride out a craving',full:true});
  Sheet.cleanup=()=>{cancelAnimationFrame(raf);clearInterval(tmr);if(tide)tide.destroy();};
  function stepA(b){
    b.innerHTML='<div><p class="step">Step 1 of 3</p><h2>Name the craving</h2></div><p class="lede">Noticing it is the first step. You don’t have to act on it or fight it.</p>'+
    sliderHTML('crI','How strong is it right now?',C.i,'None','Intense')+
    '<div class="field"><span class="flabel">What set it off?</span>'+chipsHTML('trig',trigList(),C.trig)+'</div>'+
    '<div class="field"><span class="flabel">Right now I’m…</span>'+chipsHTML('halt',HALT,[])+'</div>'+
    '<div class="field"><span class="flabel">Ride it out for</span>'+segHTML('dur',[5,10,15,20].map(m=>({v:String(m),l:m+' min'})),String(C.dur))+'<p class="fine">Most urges ease within 15 to 30 minutes (Melemis, 2015). You can add time or stop early.</p></div>'+
    '<div class="actions"><button class="btn btn-primary btn-block" id="crGo">'+I.wave+'Start riding it out</button><button class="btn btn-line btn-block" id="crLog">Just log it</button></div>';
    bindSlider(b,'crI',v=>C.i=v);bindChips(b,'trig',v=>C.trig=v);bindChips(b,'halt',vals=>HALT.forEach(x=>C.halt[x.k]=vals.includes(x.k)));bindChips(b,'dur',v=>C.dur=+v||15);
    $('#crGo',b).onclick=()=>{stepB(b);sheetScrollTop();};
    $('#crLog',b).onclick=()=>{C.out='logged';C.mins=0;C.u=Date.now();S.cravings[C.id]=C;save();closeSheet();render();toast('Craving logged.');};
  }
  function stepB(b){
    const tape=S.plan.tape;const hasTape=tape.hour||tape.tomorrow||tape.week;
    b.innerHTML='<div class="surf"><canvas class="tide" aria-hidden="true"></canvas><div class="in"><p class="step">Step 2 of 3 · Riding it out</p><p class="clock" id="sClock" aria-live="off">'+C.dur+':00</p><p class="phase" id="sPhase" aria-live="polite">Notice the urge. You don’t have to act on it or fight it.</p><p class="breath" id="sBreath" aria-hidden="true">Breathe in<small>4</small></p></div></div>'+
    '<div class="row"><button class="btn btn-quiet" id="sPause">Pause</button><button class="btn btn-quiet" id="sPlus">+5 min</button></div>'+
    '<button class="btn btn-primary btn-block" id="sDone">It’s eased. Finish</button>'+
    '<div class="card soft"><h3>Play the tape forward</h3>'+(hasTape?'<ul class="plist">'+(tape.hour?'<li><small>In the next hour</small>'+esc(tape.hour)+'</li>':'')+(tape.tomorrow?'<li><small>Tomorrow</small>'+esc(tape.tomorrow)+'</li>':'')+(tape.week?'<li><small>Next week</small>'+esc(tape.week)+'</li>':'')+(tape.sober?'<li><small>If I don’t use</small>'+esc(tape.sober)+'</li>':'')+'</ul>':'<p>Picture past the first few minutes. How does tonight end if you use? How do you feel tomorrow morning? Next week?</p>')+'</div>'+
    '<div class="card soft"><h3>My reasons</h3>'+reasonsHTML()+'</div>'+
    '<div class="card soft"><h3>Call someone</h3>'+contactsHTML()+hotlinesInline()+'</div>';
    let total=C.dur*60;const cl=$('#sClock',b),ph=$('#sPhase',b),br=$('#sBreath',b);let lastPhase='';
    const PH=[[.15,'Notice the urge. You don’t have to act on it or fight it.'],[.35,'Where do you feel it? Chest, stomach, hands, mouth? Breathe into that spot.'],[.6,'Urges rise like a wave, peak, then fall. Ride the crest with your breath.'],[.85,'Notice any change in strength, even a small one.'],[1.01,'It’s passing. You’re riding it out.']];
    lastT=performance.now();
    const curve=f=>f<.35?.62+.38*(f/.35):1-.72*((f-.35)/.65);
    tide=makeTide($('.surf canvas',b),t=>{const f=clamp(elapsed/total,0,1);const cyc=(elapsed%10);const bre=cyc<4?cyc/4:1-(cyc-4)/6;return {level:.12+.55*curve(f)*(.35+.65*C.i/10)+bre*.05,amp:.7+bre*.6};});
    const upd=()=>{const now=performance.now();if(!paused)elapsed+=(now-lastT)/1000;lastT=now;
      const left=Math.max(0,total-elapsed);cl.textContent=Math.floor(left/60)+':'+pad(Math.floor(left%60));
      const f=elapsed/total;const p=(PH.find(x=>f<x[0])||PH[PH.length-1])[1];if(p!==lastPhase){ph.textContent=p;lastPhase=p;}
      const cyc=elapsed%10;br.innerHTML=paused?'Paused':(cyc<4?'Breathe in<small>'+(4-Math.floor(cyc))+'</small>':'Breathe out<small>'+(6-Math.floor(cyc-4))+'</small>');
      if(left<=0){clearInterval(tmr);finish(true);}};
    tmr=setInterval(upd,250);
    $('#sPause',b).onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause';};
    $('#sPlus',b).onclick=()=>{total+=300;};
    $('#sDone',b).onclick=()=>finish(false);
    function finish(timeUp){clearInterval(tmr);if(tide){tide.destroy();tide=null;}C.mins=Math.max(1,Math.round(elapsed/60));stepC(b,timeUp);sheetScrollTop();}
  }
  function stepC(b,timeUp){
    C.after=Math.max(0,C.i-3);C.out='passed';
    b.innerHTML='<div><p class="step">Step 3 of 3</p><h2>'+(timeUp?'Time’s up. How strong is it now?':'How strong is it now?')+'</h2></div><p class="lede">You stayed with it for '+C.mins+(C.mins===1?' minute':' minutes')+'. It started at '+C.i+' out of 10.</p>'+
    sliderHTML('crA','Craving strength now',C.after)+
    '<div class="field"><span class="flabel">What happened?</span>'+chipsHTML('out',[{k:'passed',l:'It passed or eased'},{k:'strong',l:'Still strong, I need support'},{k:'used',l:'I used'}],'passed',false)+'</div>'+
    '<div class="field"><label for="crN">What helped, if anything?</label><textarea id="crN" rows="2" placeholder="Optional"></textarea></div>'+
    '<div class="actions"><button class="btn btn-primary btn-block" id="crSave">Save</button></div>';
    bindSlider(b,'crA',v=>C.after=v);bindChips(b,'out',v=>C.out=v||'passed');
    $('#crSave',b).onclick=()=>{
      C.note=$('#crN',b).value.trim();C.u=Date.now();S.cravings[C.id]=C;save();closeSheet(true);render();
      if(C.out==='used')openLapse({t:Date.now(),trig:C.trig});
      else if(C.out==='strong'){openSOS();toast('Craving saved. Reach out now.');}
      else toast('Saved. You rode out a '+C.i+'/10 craving.');
    };
  }
}

function openLapse(pre){
  pre=pre||{};const ex=pre.id?S.lapses[pre.id]:null;
  const L=ex?clone(ex):{id:uid(),t:pre.t||Date.now(),kind:'lapse',subs:S.profile.substances.slice(0,1),trig:pre.trig||[],before:'',thought:'',diff:'',next:[]};
  const subs=Array.from(new Set(S.profile.substances.concat(L.subs||[]))).map(x=>({k:x,l:x}));
  openSheet(b=>{
    b.innerHTML='<div><p class="step">'+(pre.fromCheckin?'You said you used':'Log a slip')+'</p><h2>Thank you for being honest</h2></div>'+
    '<p class="lede">A slip is information about what you need, not proof you’ve failed. Logging it is a recovery skill.</p>'+
    '<div class="field"><label for="lT">When</label><input type="datetime-local" id="lT" value="'+toInput(L.t)+'"></div>'+
    (subs.length?'<div class="field"><span class="flabel">What did you use?</span>'+chipsHTML('subs',subs,L.subs)+'</div>':'')+
    '<div class="field"><span class="flabel">Was this a one-time slip or a return to regular use?</span>'+segHTML('kind',[{v:'lapse',l:'One-time slip'},{v:'relapse',l:'Regular use'},{v:'unsure',l:'Not sure'}],L.kind)+'</div>'+
    '<div class="field"><span class="flabel">What set it off?</span>'+chipsHTML('trig',trigList(),L.trig)+'</div>'+
    '<div class="field"><label for="lB">What was happening just before?</label><textarea id="lB" rows="2" placeholder="Where you were, who you were with, how you felt">'+esc(L.before)+'</textarea></div>'+
    '<div class="field"><label for="lTh">What thought made it feel okay?</label><textarea id="lTh" rows="2" placeholder="For example: “I’ve earned it” or “just this once”">'+esc(L.thought)+'</textarea></div>'+
    '<div class="field"><label for="lD">What would you do differently next time?</label><textarea id="lD" rows="2" placeholder="One specific thing">'+esc(L.diff)+'</textarea></div>'+
    '<div class="field"><span class="flabel">In the next 24 hours I will…</span>'+chipsHTML('next',NEXT24,L.next)+'</div>'+
    safetyHTML()+
    '<div class="actions"><button class="btn btn-primary btn-block" id="lSave">Save and keep going</button>'+(ex?'<button class="btn btn-line btn-block" id="lDel" style="color:var(--berry)">Delete this entry</button>':'')+'</div>';
    bindChips(b,'subs',v=>L.subs=v);bindChips(b,'kind',v=>L.kind=v||'lapse');bindChips(b,'trig',v=>L.trig=v);bindChips(b,'next',v=>L.next=v);
    $('#lSave',b).onclick=()=>{
      const t=fromInput($('#lT',b).value);if(t)L.t=Math.min(t,Date.now());
      L.before=$('#lB',b).value.trim();L.thought=$('#lTh',b).value.trim();L.diff=$('#lD',b).value.trim();L.auto=false;L.u=Date.now();
      S.lapses[L.id]=L;const k=dk(L.t);if(checkin(k)&&!checkin(k).used){S.checkins[k]=Object.assign({},S.checkins[k],{used:true,u:Date.now()});}
      save();render();after(b);sheetScrollTop();
    };
    if(ex)$('#lDel',b).onclick=()=>confirmSheet({title:'Delete this entry?',body:'Your streak and totals will be recalculated without it.',ok:'Delete',danger:true,onOk:()=>{S.lapses[L.id]=Object.assign({},S.lapses[L.id],{del:true,u:Date.now()});save();render();toast('Entry deleted.');}});
  },{label:'Log a slip'});
  function after(b){
    const s=stats();
    b.innerHTML='<h2>Your progress still counts</h2>'+
    '<div class="tally"><div><p class="big num">'+s.clean+'<small> / '+s.total+'</small></p><p>days without use since you started</p></div><div><p class="big num">'+Math.floor(s.longest/DAY)+'<small> days</small></p><p>longest stretch so far</p></div></div>'+
    '<p>Your current streak restarts from this slip. The days you’ve already stayed substance-free don’t disappear, and neither do the skills you used to get them.</p>'+
    '<div class="note-box"><h3>Why this matters</h3><p>Research on relapse finds that how people explain a slip shapes what happens next. Blaming yourself as a person (“I’m hopeless”) makes a full relapse more likely. Treating it as a mistake with causes you can work on makes it less likely.</p>'+cite('larimer')+'</div>'+
    (L.kind==='relapse'?'<div class="note-box"><h3>Get more support now</h3><p>A return to regular use is a sign the plan needs more support. Contact your counselor, doctor or a helpline today. Relapse is common in a chronic condition, and treatment can be restarted or adjusted.</p>'+cite('mclellan')+'<button class="btn btn-quiet" data-act="phhelp">Treatment options in the Philippines</button></div>':'')+
    '<div class="actions"><button class="btn btn-primary btn-block" data-act="sos">Call someone or a helpline</button><button class="btn btn-line btn-block" data-act="sheet-close">Done</button></div>';
  }
}

function openWarn(id){
  const ex=id&&S.warn[id]&&!S.warn[id].del?S.warn[id]:null;
  const sel=new Set(ex?[].concat(ex.e||[],ex.m||[],ex.p||[]):[]);let t=ex?ex.t:Date.now();
  openSheet(b=>{
    const own=S.plan.signs.filter(x=>x.text);
    const box=(g,k,l)=>'<label class="check"><input type="checkbox" data-g="'+g+'" value="'+esc(k)+'"'+(sel.has(k)?' checked':'')+'>'+esc(l)+'</label>';
    b.innerHTML='<div><p class="step">'+(ex?'Edit this check':'About one minute')+'</p><h2>Warning-signs check</h2></div><p class="lede">Relapse is usually a gradual process with stages. Tick anything that’s been true this past week.</p>'+
    (ex?'<div class="field"><label for="wT">Date of this check</label><input type="datetime-local" id="wT" value="'+toInput(t)+'"></div>':'')+
    '<div class="field"><h3>Taking care of myself</h3><p class="fine">Emotional relapse signs'+(own.length?', including your own':'')+'</p><div class="checks">'+WARN_E.map(x=>box('e',x.k,x.l)).join('')+own.map(x=>box('e','own:'+x.id,x.text)).join('')+'</div></div>'+
    '<div class="field"><h3>Thoughts about using</h3><p class="fine">Mental relapse signs</p><div class="checks">'+WARN_M.map(x=>box('m',x.k,x.l)).join('')+'</div></div>'+
    '<div class="field"><h3>Actions</h3><div class="checks">'+WARN_P.map(x=>box('p',x.k,x.l)).join('')+'</div></div>'+
    '<div class="actions"><button class="btn btn-primary btn-block" id="wSave">'+(ex?'Save changes':'See my result')+'</button>'+(ex?'<button class="btn btn-line btn-block" id="wDel" style="color:var(--berry)">Delete this check</button>':'')+'</div>'+cite('melemis');
    $('#wSave',b).onclick=()=>{
      const W={e:[],m:[],p:[]};$$('input[type=checkbox]',b).forEach(c=>{if(c.checked)W[c.dataset.g].push(c.value);});
      if(ex){const tt=fromInput($('#wT',b).value);if(tt)t=Math.min(tt,Date.now());}
      const stage=stageOf(W.e.length,W.m.length,W.p.length>0);
      const rec={id:ex?ex.id:uid(),t,e:W.e,m:W.m,p:W.p,stage,u:Date.now()};S.warn[rec.id]=rec;save();render();
      showWarnResult(b,rec);sheetScrollTop();
    };
    if(ex)$('#wDel',b).onclick=()=>confirmSheet({title:'Delete this check?',ok:'Delete',danger:true,onOk:()=>{S.warn[ex.id]=Object.assign({},ex,{del:true,u:Date.now()});save();render();toast('Check deleted.');}});
  },{label:'Warning-signs check'});
}
function showWarnResult(b,rec){
  const st=STAGES[rec.stage];
  b.innerHTML='<div><p class="step">'+esc(fmtDT(rec.t))+'</p><h2>'+esc(st.t)+'</h2></div><span class="pill '+st.cls+'" style="align-self:flex-start"><span class="dot"></span>'+rec.e.length+' self-care signs · '+rec.m.length+' thought signs'+(rec.p.length?' · action taken':'')+'</span>'+
  '<p class="lede">'+esc(st.d)+'</p><div class="note-box"><h3>What helps at this stage</h3><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+st.acts.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div>'+
  '<p class="fine">This is a self-check based on the stages of relapse described by Melemis (2015). It isn’t a diagnosis.</p>'+
  '<div class="actions">'+(rec.stage==='act'||rec.stage==='mental'?'<button class="btn btn-primary btn-block" data-act="sos">Reach out now</button><button class="btn btn-quiet btn-block" data-act="craving">Ride out an urge</button>':'')+(rec.stage!=='steady'?'<button class="btn btn-quiet btn-block" data-act="phhelp">Treatment options in the Philippines</button>':'')+'<button class="btn btn-line btn-block" data-act="sheet-close">Done</button></div>';
}

function openSOS(){
  let reg=S.settings.region||defaultRegion();
  openSheet(b=>{
    const draw=()=>{
      const R=LINES[reg]||LINES.ph;const mine=S.plan.lines.filter(l=>l.name||l.phone);
      b.innerHTML='<h2>Help now</h2>'+
      '<div class="safety"><h3>'+I.shield+'Possible overdose? Call 911</h3><p>After shabu: chest pain, a seizure, a very hot body, or severe confusion. After alcohol, opioids or sedatives: can’t be woken, or breathing slowly or not at all. Call 911 and stay with them.</p><a class="btn btn-danger" href="tel:911">'+I.phone+'Call 911</a></div>'+
      '<div class="row"><button class="btn btn-primary" data-act="craving">'+I.wave+'Ride it out</button><button class="btn btn-quiet" data-act="breathe">'+I.breath+'Breathe</button></div>'+
      '<div class="card soft"><div class="card-h"><h3>My people</h3><button class="linkbtn" data-act="edit-contacts">Edit</button></div>'+contactsHTML()+'</div>'+

/* ============ Demo data ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  const R=mulberry(11);const pick=a=>a[Math.floor(R()*a.length)];
  const st=blank();st.demo=true;const now=Date.now();
  const startK=addDays(dk(now),-64);const start=parseDk(startK).getTime()+21.5*HOUR;

  st.plan.tape={hour:'I’d feel great for a bit, then start planning how to get more.',tomorrow:'No sleep, late for work, lying to my daughter about where I was.',week:'Borrowing money again and hiding it. Back to day one.',sober:'A rough night, but I wake up clear and take her to school like I promised.'};
  const lapseD=31;const lapseT=parseDk(addDays(startK,lapseD)).getTime()+22*HOUR;
  st.lapses.l1={id:'l1',t:lapseT,kind:'lapse',subs:['Shabu (methamphetamine)'],trig:['money','people'],before:'Got my sweldo and ran into an old barkada outside the store.',thought:'“Just tonight. I’ve earned it.”',diff:'Send my pay to savings first and call Kuya Jun right after work.',next:['tell','meet'],u:lapseT};
  const total=daysBetween(startK,dk(now));
  const tw=[['stress',5],['bored',4],['lonely',3],['family',2],['people',2],['party',1],['money',2],['tired',3],['work',2],['cue',1]];
  const wpick=()=>{const s=tw.reduce((a,b)=>a+b[1],0);let r=R()*s;for(const x of tw){if((r-=x[1])<0)return x[0];}return 'stress';};
  for(let d=1;d<=total;d++){
    const k=addDays(startK,d);const prog=d/total;const near=d>=lapseD-5&&d<=lapseD+2;
    const sleepH=clamp(Math.round(((near?5.2:6.4+prog*1.2)+(R()-.5)*2.6)*2)/2,3,10);
    let base=7-4.4*prog+(near?2.4*(1-Math.abs(d-lapseD)/7):0)+(sleepH<6?1.2:0);
    const cr=clamp(Math.round(base+(R()-.5)*2.2),0,10);
    const nAct=clamp(Math.round((10-cr)/3+(R()-.5)*2),0,5);const acts=ACTIONS.map(a=>a.k).sort(()=>R()-.5).slice(0,nAct);
    if(R()>.13||d===lapseD||d===total){
      st.checkins[k]={id:k,d:k,mood:String(clamp(Math.round(4.9-cr*.36+(R()-.5)*1.3),1,5)),craving:cr,halt:{h:R()<.15,a:R()<(near?.4:.12),l:R()<(near?.5:.2),t:sleepH<6||R()<.15},sleep:sleepH,used:d===lapseD,actions:acts,note:'',u:now};
    }
    const nc=(R()<(.95-.6*prog+(near?.5:0))?1:0)+(R()<(near?.5:.12)?1:0);
    for(let j=0;j<nc;j++){
      const hr=pick([8,12,14,16,17,18,19,19,20,20,21,21,22,22,23,1]);const t=parseDk(k).getTime()+hr*HOUR+Math.floor(R()*50)*MIN;if(t>now)continue;
      const i=clamp(cr+Math.round((R()-.2)*2),2,10);const id='c'+d+'_'+j;const tr=[wpick()];if(R()<.3)tr.push(wpick());
      st.cravings[id]={id,t,i,trig:Array.from(new Set(tr)),halt:{h:R()<.18,a:R()<.2,l:R()<.3,t:R()<.35},mins:pick([10,15,15,15,20]),after:Math.max(0,i-2-Math.floor(R()*4)),out:'passed',note:'',u:now};
    }
  }
  st.cravings.cL={id:'cL',t:lapseT-40*MIN,i:9,trig:['money','people'],halt:{h:false,a:false,l:true,t:true},mins:3,after:9,out:'used',note:'',u:now};
  [6,13,20,27,34,41,48,55,62].forEach(d=>{if(d>total)return;const t=parseDk(addDays(startK,d)).getTime()+19*HOUR;let e=[],m=[];
    if(d===27){e=['iso','sleep','mood'];m=['glam','bargain'];}else if(d===20){e=['sleep','nofun','bottle'];}else if(d===34){e=['bottle','mood'];m=['crave'];}else if(d<20){e=R()<.5?['sleep']:[];}else{e=R()<.4?['nofun']:[];}
    const id='w'+d;st.warn[id]={id,t,e,m,p:[],stage:stageOf(e.length,m.length,false),u:now};});

  return st;
}

    S.plan.reasons=OB.reasons.filter(Boolean).map(t=>({id:uid(),text:t}));
    S.plan.name=OB.name.slice(0,40);const sp=parseFloat(String(OB.spend).replace(/[^\d.]/g,''));S.plan.spend=isNaN(sp)?0:clamp(sp,0,1e6);
    if(OB.cname||OB.cphone)S.plan.contacts=[{id:uid(),name:OB.cname,phone:OB.cphone}];
    S.settings.sync=!!OB.sync;S.settings.region=defaultRegion();touchCore();S.settings.lastMile=OB.start+':0';
    save();hideOnboarding();ROUTE='today';try{history.replaceState(null,'','#today');}catch(_){}render();
    if(S.settings.sync)pull();
    toast('Your tracker is ready.');
  }
});

/* ============ Global actions ============ */
function shiftCal(n){let m=CAL.m+n,y=CAL.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}CAL={y,m};render();}
const ACTS={
  tab:a=>go(a.dataset.tab),
  sos:()=>openSOS(),craving:()=>openCraving(),checkin:a=>openCheckin(a.dataset.k),lapse:()=>openLapse(),warn:()=>openWarn(),
  breathe:()=>openBreathe(),ground:()=>openGround(),halt:()=>openHaltTool(),tape:()=>openTape(),delay:()=>openDelay(),rules:()=>openRules(),safety:()=>openSafety(),
  day:a=>openDay(a.dataset.k),calprev:()=>shiftCal(-1),calnext:()=>shiftCal(1),entry:a=>openEntry(a.dataset.type,a.dataset.id),
  'sheet-close':()=>closeSheet(),
  'edit-reasons':()=>openListEditor({title:'Why I’m doing this',intro:'Short and personal works best. These show up on your Today screen and during cravings.',items:S.plan.reasons,fields:[{k:'text',l:'Reason',ph:'For example: be there for my kids'}],onSave:r=>S.plan.reasons=r}),
  'edit-contacts':()=>openListEditor({title:'My people',intro:'People you can call or text when it’s hard.',items:S.plan.contacts,fields:[{k:'name',l:'Name',ph:'Name'},{k:'phone',l:'Phone',ph:'Phone number',type:'tel'}],onSave:r=>S.plan.contacts=r}),
  'edit-risks':()=>openListEditor({title:'High-risk situations',intro:'Name a situation where using feels likely, then a specific way out.',items:S.plan.risks,fields:[{k:'situation',l:'When',ph:'For example: payday with cash on me',multi:true},{k:'plan',l:'My exit plan',ph:'For example: send money to savings, go straight home',multi:true}],onSave:r=>S.plan.risks=r}),
  'edit-signs':()=>openListEditor({title:'My early warning signs',intro:'Things you notice in yourself before things slide.',items:S.plan.signs,fields:[{k:'text',l:'Warning sign',ph:'For example: skipping meals'}],onSave:r=>S.plan.signs=r}),
  'edit-recovery':()=>openRecoveryEditor(),
  phhelp:()=>openPHHelp(),'backup-file':()=>backupFile(),install:()=>openInstall(),rewards:()=>openRewards(),prefs:()=>openPrefs(),
  addcrav:a=>openCravingEdit(null,a.dataset.k),
  addslip:a=>{const k=a.dataset.k;openLapse({t:k===dk(Date.now())?Date.now():parseDk(k).getTime()+20*HOUR});},
  'edit-triggers':()=>openListEditor({title:'Trigger list',intro:'Rename, remove or add triggers. They appear when you log cravings and slips. Past entries keep their labels.',items:trigList().map(t=>({id:t.k,l:t.l})),fields:[{k:'l',l:'Trigger',ph:'For example: passing the old tambayan'}],max:30,
    onSave:r=>{const old=S.plan.trigOld||{};trigList().forEach(t=>{if(!r.some(x=>x.id===t.k))old[t.k]=t.l;});S.plan.trigOld=old;S.plan.triggers=r.map(x=>({k:x.id,l:x.l}));},
    after:'<button type="button" class="btn btn-line btn-block" id="edReset">Restore the default list</button>',
    wire:b=>{const x=$('#edReset',b);if(x)x.onclick=()=>{S.plan.triggers=null;touchCore();save();closeSheet();render();toast('Default triggers restored.');};}}),
  'edit-actions':()=>openListEditor({title:'Recovery actions',intro:'The things you can tick in your daily check-in. Add what helps you, like jogging, a hobby or a church group.',items:actList().map(t=>({id:t.k,l:t.l})),fields:[{k:'l',l:'Action',ph:'For example: basketball with my cousins'}],max:30,
    onSave:r=>{S.plan.actions=r.map(x=>({k:x.id,l:x.l}));},
    after:'<button type="button" class="btn btn-line btn-block" id="edReset">Restore the default list</button>',
    wire:b=>{const x=$('#edReset',b);if(x)x.onclick=()=>{S.plan.actions=null;touchCore();save();closeSheet();render();toast('Default actions restored.');};}}),
  'edit-lines':()=>openListEditor({title:'My saved numbers',intro:'Numbers you might need: your barangay health center, rural health unit, doctor, counselor or rehab center.',items:S.plan.lines,fields:[{k:'name',l:'Name',ph:'For example: Barangay health center'},{k:'phone',l:'Phone',ph:'Number',type:'tel'},{k:'note',l:'Note',ph:'Hours, address or who to ask for'}],onSave:r=>S.plan.lines=r}),
  'sync-on':async()=>{S.settings.sync=true;save();refreshSyncUI();await pull();toast(Cloud.sync==='ok'?'Private backup is on.':'Backup will retry shortly.');},
  'sync-now':()=>pull(),
  'sync-off':()=>confirmSheet({title:'Turn off private backup?',body:'New entries will only be saved on this device. You can also delete the copy in your Claude account.',ok:'Turn off and delete the backup copy',danger:true,onOk:async()=>{S.settings.sync=false;save();const ok=await deleteCloud();refreshSyncUI();toast(ok?'Backup turned off and deleted.':'Backup turned off. The copy couldn’t be deleted right now.');}}),
  'backup-copy':()=>backupCopy(),'backup-restore':()=>backupRestore(),
  wipe:()=>confirmSheet({title:'Delete all your data?',body:'This erases every entry on this device'+(S.settings.sync?' and in your private backup':'')+'. It can’t be undone. Copy a backup code first if you might want it later.',ok:'Delete everything',danger:true,onOk:async()=>{if(S.settings.sync&&!S.demo)await deleteCloud();S=blank();saveLocal();showOnboarding();}}),
  'demo-exit':()=>{S=blank();saveLocal();showOnboarding();}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=ACTS[a.dataset.act];if(!f)return;e.preventDefault();
  const inSheet=a.closest('#sheetRoot');const act=a.dataset.act;
  if(inSheet&&act!=='sheet-close')closeSheet(true);
  f(a,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetRoot').classList.contains('open'))closeSheet();});

/* ============ Boot ============ */
function boot(){
  LOCAL_OK=testLocal();
  S=normalize(loadLocal());
  readRoute();
  if(!S.profile)showOnboarding();else render();
  initCloud();
  if(APP_BUILD&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  if(APP_BUILD&&IS_STANDALONE&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
  setInterval(()=>{if(!document.hidden&&ROUTE==='today')tick();},30000);
}
boot();
</script>
